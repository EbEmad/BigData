version: "3"

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop2.7.4-java8
    container_name: namenode
    volumes:
      - namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=test
    env_file:
      - ./hadoop-hive.env
    ports:
      - "50070:50070"

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop2.7.4-java8
    container_name: datanode
    volumes:
      - datanode:/hadoop/dfs/data
    env_file:
      - ./hadoop-hive.env
    environment:
      SERVICE_PRECONDITION: "namenode:50070"
    ports:
      - "50075:50075"
    depends_on:
      - namenode

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    env_file:
      - ./hadoop-hive.env
    environment:
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore/metastore"
      SERVICE_PRECONDITION: "hive-metastore:9083"
    ports:
      - "10000:10000"
    depends_on:
      - hive-metastore

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    env_file:
      - ./hadoop-hive.env
    command: /opt/hive/bin/hive --service metastore
    environment:
      SERVICE_PRECONDITION: "namenode:50070 datanode:50075 hive-metastore-postgresql:5432"
    ports:
      - "9083:9083"
    depends_on:
      - namenode
      - datanode
      - hive-metastore-postgresql

  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-postgresql
    ports:
      - "5432:5432"
  presto-coordinator:
    image: shawnzhu/prestodb:0.181
    ports:
      - "8080:8080"
    depends_on:
      - hive-server

  nifi:
    image: apache/nifi:1.25.0
    container_name: nifi
    ports:
      - "8443:8443"
    environment:
      - NIFI_WEB_HTTP_PORT=8443
      - NIFI_WEB_HTTP_HOST=0.0.0.0
    volumes:
      - nifi_data:/opt/nifi/nifi-current/data
      - nifi_conf:/opt/nifi/nifi-current/conf
      - ./source:/source
      - ./conf/core-site.xml:/etc/hadoop/core-site.xml
    depends_on:
      - namenode
      - datanode

  starburst:
    image: trinodb/trino:latest
    container_name: starburst
    ports:
      - "8085:8085"
    volumes:
      - ./conf/trino/config.properties:/etc/trino/config.properties
      - ./conf/trino/jvm.config:/etc/trino/jvm.config
      - ./conf/trino/node.properties:/etc/trino/node.properties
      - ./conf/trino/log.properties:/etc/trino/log.properties
      - ./conf/trino/catalog/hive.properties:/etc/trino/catalog/hive.properties
      - ./conf/trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties
      - ./conf/trino/catalog/iceberg_rest.properties:/etc/trino/catalog/iceberg_rest.properties
      - ./conf/core-site.xml:/etc/trino/core-site.xml
    depends_on:
      - hive-metastore
      - namenode
      - datanode

  spark-iceberg:
    image: tabulario/spark-iceberg:3.5.1_1.5.0
    container_name: spark-iceberg
    ports:
      - "8888:8888" # Jupyter Notebook
      - "8081:8080" # Spark Master UI
      - "18080:18080" # Spark History Server
    environment:
      - AWS_REGION=us-east-1
      - SPARK_HOME=/opt/spark
    volumes:
      - ./conf/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./conf/spark/hive-site.xml:/opt/spark/conf/hive-site.xml
      - ./conf/core-site.xml:/opt/spark/conf/core-site.xml
      - ./source:/home/iceberg/source
      - spark_data:/home/iceberg/warehouse
    depends_on:
      - hive-metastore
      - namenode
      - datanode
      - iceberg-rest

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      - CATALOG_WAREHOUSE=hdfs://namenode:8020/user/iceberg/warehouse
      - CATALOG_IO__IMPL=org.apache.iceberg.hadoop.HadoopFileIO
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
    depends_on:
      - namenode
      - datanode

volumes:
  namenode:
  datanode:
  nifi_data:
  nifi_conf:
  spark_data:
