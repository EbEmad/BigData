global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # ---- Prometheus self-monitoring ----
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ---- Host Metrics (CPU, RAM, Disk) ----
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # ---- Hadoop NameNode ----
  - job_name: 'hadoop-namenode'
    metrics_path: '/jmx'
    static_configs:
      - targets: ['namenode:50070']
        labels:
          component: 'namenode'

  # ---- Hadoop DataNode ----
  - job_name: 'hadoop-datanode'
    metrics_path: '/jmx'
    static_configs:
      - targets: ['datanode:50075']
        labels:
          component: 'datanode'
  
  # ---- JMX Exporter (Hive / JVM metrics) ----
  - job_name: 'jmx-exporter'
    static_configs:
      - targets: ['jmx-exporter:5556']
        labels:
          component: 'hive'

  



